name: CI (frontend & backend)

on:
  push:
    branches: ["main", "saul", "jhonny"]
  pull_request:
    branches: ["main", "saul", "jhonny"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

  NODE_ENV: test # Asegura entorno correcto para Vitest


jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Ensure test DOM deps
        run: npm install --save-dev jsdom whatwg-url @testing-library/react @testing-library/jest-dom

      - name: Lint
        run: npm run lint

      - name: Test (Vitest)
        run: |
          echo "Checking for test files..."
          if find ./src -type f \( -name "*.test.*" -o -name "*.spec.*" \) | grep -q .; then
            echo "Running Vitest (npm test)..."
            npm test -- --run --reporter=verbose
          else
            echo "No test files found; skipping Vitest."
          fi

      - name: Build
        run: npm run build --if-present

  backend:
    name: Backend (lint, test, build)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Check backend presence
        id: has_backend
        run: |
          if [ -f backend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js ${{ matrix.node-version }}
        if: steps.has_backend.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        if: steps.has_backend.outputs.present == 'true'
        run: |
          npm ci
          npm install --save-dev vitest supertest @types/supertest

      - name: Lint (optional)
        if: steps.has_backend.outputs.present == 'true'
        run: npm run lint --if-present

      - name: Test (Vitest - Node)
        if: steps.has_backend.outputs.present == 'true'
        run: |
          echo " Buscando archivos de prueba..."
          if find ./test -type f \( -name "*.test.*" -o -name "*.spec.*" \) | grep -q .; then
            echo " Ejecutando pruebas de backend con Vitest..."
            npm test -- --run --reporter=verbose
          else
            echo "  No se encontraron archivos de prueba en backend/test, se omite."
          fi

      - name: Build (optional)
        if: steps.has_backend.outputs.present == 'true'
        run: npm run build --if-present
