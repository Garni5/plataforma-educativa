# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: CI (frontend & backend)

on:
  push:
    branches: ["main", "saul"]
  pull_request:
    branches: ["main", "saul"]

# Evita ejecutar jobs viejos si empujas más commits a la misma rama/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    # Todos los "run:" se ejecutan dentro de ./frontend
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (Vitest)
        run: npm test -- --run  # tu script ya es "vitest run"

      - name: Build
        run: npm run build --if-present

  backend:
    name: Backend (lint, test, build if present)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      # Verifica si existe backend/package.json
      - name: Check backend presence
        id: has_backend
        run: |
          if [ -f backend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js ${{ matrix.node-version }}
        if: steps.has_backend.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        if: steps.has_backend.outputs.present == 'true'
        working-directory: ./backend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint (optional)
        if: steps.has_backend.outputs.present == 'true'
        working-directory: ./backend
        run: npm run lint --if-present

      - name: Test (skip if none)
        if: steps.has_backend.outputs.present == 'true'
        working-directory: ./backend
        run: |
          if ls -1 **/*.test.* **/*.spec.* 2>/dev/null | grep -q .; then
            npm test -- --run
          else
            echo "No backend test files found; skipping tests."
          fi

      - name: Build (optional)
        if: steps.has_backend.outputs.present == 'true'
        working-directory: ./backend
        run: npm run build --if-present

